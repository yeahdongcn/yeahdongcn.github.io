<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEON TURF — Gang Warfare RTS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="NEON TURF — an original real-time strategy game of gang warfare in a neon megacity. Harvest Glint, build your base, claim the blocks, break the rival gang. Runs in your browser: vanilla JS, zero dependencies, all art and audio procedural.">
<meta name="theme-color" content="#07070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2307070d'/%3E%3Cpath d='M5 23 16 6l11 17h-6l-5-8-5 8z' fill='%23ff3d81'/%3E%3Cpath d='M11 27h10' stroke='%2319e3ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/neon.css?v=1">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<noscript><p style="color:#e8ecf5;font-family:monospace;padding:2em">NEON TURF needs JavaScript.</p></noscript>

<!--
  LOAD ORDER MATTERS — plain scripts sharing the single global `NT`; no modules, no build.
  data-sim = headless-safe simulation files: test/harness.js loads exactly these, in this
  order, so this page is the one source of truth. Bump ?v= on EVERY tag together whenever
  any file changes (browsers otherwise mix cached versions).
-->
<script data-sim src="js/core.js?v=1"></script>
<script data-sim src="js/rules.js?v=1"></script>
<script data-sim src="js/factions/neutral.js?v=1"></script>
<script data-sim src="js/factions/curfew.js?v=1"></script>
<script data-sim src="js/factions/pitfang.js?v=1"></script>
<script data-sim src="js/map.js?v=1"></script>
<script data-sim src="js/mapgen.js?v=1"></script>
<script data-sim src="js/sim.js?v=1"></script>
<script data-sim src="js/path.js?v=1"></script>
<script data-sim src="js/move.js?v=1"></script>
<script data-sim src="js/combat.js?v=1"></script>
<script data-sim src="js/fog.js?v=1"></script>
<script data-sim src="js/econ.js?v=1"></script>
<script data-sim src="js/prod.js?v=1"></script>
<script data-sim src="js/traits.js?v=1"></script>
<script data-sim src="js/powers.js?v=1"></script>
<script data-sim src="js/victory.js?v=1"></script>
<script data-sim src="js/ai.js?v=1"></script>
<!-- presentation (DOM): i18n, art kit, one *.art.js per faction, then the modules; main.js boots last -->
<script src="js/i18n.js?v=1"></script>
<script src="js/art.js?v=1"></script>
<script src="js/factions/neutral.art.js?v=1"></script>
<script src="js/factions/curfew.art.js?v=1"></script>
<script src="js/factions/pitfang.art.js?v=1"></script>
<script src="js/terrain.js?v=1"></script>
<script src="js/fx.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
<script src="js/input.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
